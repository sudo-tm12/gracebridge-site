<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GraceBridge – Pharmacist dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23d8232b'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='700' fill='%23fff' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="staff.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head><body>
<div id="app"></div>
<script>
const CONFIG={SUPABASE_URL:"https://eowttngvvcjqouedklrs.supabase.co",SUPABASE_ANON_KEY:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvd3R0bmd2dmNqcW91ZWRrbHJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNTkzODIsImV4cCI6MjEwODkzNTM4Mn0.R-2iYMSBI6D4OGmXTWcQEm5khi1RUDIyn8v73vf-R2s"};
const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
// Escapes for HTML text AND attribute values (including single quotes).
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R=c=>"R "+(c/100).toFixed(2);
let me=null,timer=null;

function loginView(msg){
  $("app").innerHTML=`<form class="login" onsubmit="return signIn(event)"><h2 style="margin:0">Pharmacist login</h2>
  <input name="e" type="email" placeholder="Email" required autocomplete="email"><input name="p" type="password" placeholder="Password" required autocomplete="current-password">
  <button>Log in</button><small>${esc(msg||"")}</small></form>`;
}
async function signIn(e){e.preventDefault();const f=e.target,b=f.querySelector("button");b.disabled=true;b.textContent="Logging in…";
  const {error}=await sb.auth.signInWithPassword({email:f.e.value.trim(),password:f.p.value});
  if(error){loginView(error.message);return false}
  boot();return false}
async function signOut(){sb.removeAllChannels();clearInterval(timer);timer=null;await sb.auth.signOut();loginView()}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){loginView();return}
  const {data:role}=await sb.from("staff_roles").select("role,display_name").eq("user_id",session.user.id).maybeSingle();
  if(!role||!["pharmacist","admin"].includes(role.role)){await sb.auth.signOut();loginView("This account is not a pharmacist account.");return}
  me={id:session.user.id,name:role.display_name||session.user.email};
  $("app").innerHTML=`<header><b>GraceBridge · Pharmacist</b><span>${esc(me.name)}</span><button class="o" onclick="signOut()" style="color:#fff;border-color:#4b628f">Log out</button></header><main id="main"></main>`;
  load();
  sb.removeAllChannels();
  sb.channel("pharm").on("postgres_changes",{event:"*",schema:"public",table:"prescriptions"},load)
    .on("postgres_changes",{event:"*",schema:"public",table:"orders"},load).subscribe();
  clearInterval(timer);timer=setInterval(tick,1000);
}

async function load(){
  const [rx,od]=await Promise.all([
    sb.from("prescriptions").select("*, profiles(full_name,phone)").in("status",["reviewing","approved"]).order("created_at",{ascending:true}),
    sb.from("orders").select("*, profiles(full_name,phone)").eq("status","paid").order("paid_at",{ascending:true})]);
  if(!$("main"))return;
  if(rx.error||od.error){$("main").innerHTML=`<p class="empty">${esc((rx.error||od.error).message)}</p>`;return}
  // Keep amounts the pharmacist is typing when a realtime update re-renders the list.
  const typed={};document.querySelectorAll("input[data-amt]").forEach(i=>{if(i.value)typed[i.dataset.amt]=i.value});
  const rv=rx.data.filter(x=>x.status==="reviewing"),ap=rx.data.filter(x=>x.status==="approved");
  $("main").innerHTML=
    `<h2>Prescriptions to review</h2>${rv.map(rxCard).join("")||'<p class="empty">Nothing waiting.</p>'}`+
    `<h2>Approved, waiting for payment</h2>${ap.map(rxCard).join("")||'<p class="empty">None.</p>'}`+
    `<h2>Paid orders to dispatch</h2>${od.data.map(orderCard).join("")||'<p class="empty">No orders to dispatch.</p>'}`;
  document.querySelectorAll("input[data-amt]").forEach(i=>{if(typed[i.dataset.amt])i.value=typed[i.dataset.amt]});
  tick();
}
// Record values go into escaped data-* attributes, never into inline JS strings,
// so a crafted value (e.g. a file_path written directly via the API) cannot run script here.
function rxCard(x){
  const p=x.profiles||{},id=esc(x.id);let a="",st="";
  if(x.status==="reviewing"){
    st=x.due_at?`<span class="cd" data-end="${new Date(x.due_at).getTime()}"></span>`:"";
    a=`<button class="o" data-path="${esc(x.file_path)}" onclick="view(this)">View prescription</button><input data-amt="${id}" type="number" min="1" step="0.01" placeholder="Amount (R)" aria-label="Amount to charge in rand"><button data-id="${id}" onclick="approve(this)">Approve</button><button class="o" data-id="${id}" onclick="reject(this)">Reject</button>`;
  }else st=`<small>${R(x.amount_cents)} · payment link sent</small>`;
  return `<div class="card"><div class="row"><b>${esc(p.full_name||"Patient")}</b>${st}</div><small>${esc(p.phone||"")}</small>
  ${x.address?`<p style="margin:6px 0 0">${esc(x.address)}</p>`:""}${x.notes?`<p class="m" style="margin:6px 0 0">${esc(x.notes)}</p>`:""}<div class="acts">${a}</div></div>`;
}
function orderCard(o){
  const p=o.profiles||{};
  return `<div class="card"><div class="row"><b>${esc(p.full_name||"Patient")}</b><span>${R(o.total_cents)}</span></div><small>${esc(p.phone||"")}</small>
  <p style="margin:6px 0 0">${esc(o.address||"")}</p><p class="m" style="margin:6px 0 0">${(o.items||[]).map(i=>esc((i.qty||1)+" × "+i.name)).join("<br>")}</p>
  <div class="acts"><button data-id="${esc(o.id)}" onclick="dispatch(this)">Mark dispatched</button></div></div>`;
}
function tick(){const n=Date.now();document.querySelectorAll(".cd").forEach(el=>{const d=+el.dataset.end-n;
  if(d<=0){el.textContent="Overdue "+Math.floor(-d/60000)+" min"}else{const m=Math.floor(d/60000),s=Math.floor(d%60000/1000);el.textContent=`${m}:${String(s).padStart(2,"0")} left`}})}
async function view(btn){
  // Open the tab synchronously (inside the click) so iOS Safari and other popup blockers allow it.
  const w=window.open("","_blank");
  const {data,error}=await sb.storage.from("prescriptions").createSignedUrl(btn.dataset.path,300);
  if(error){if(w)w.close();alert(error.message);return}
  if(w){w.opener=null;w.location.href=data.signedUrl}else location.assign(data.signedUrl);
}
function lock(btn){btn.closest(".acts").querySelectorAll("button,input").forEach(b=>b.disabled=true)}
async function call(btn,body){
  lock(btn);
  const {data,error}=await sb.functions.invoke("approve-prescription",{body});
  if(error||(data&&data.error)){let m=data&&data.error;if(!m&&error.context&&error.context.json){try{m=(await error.context.json()).error}catch(_){}}alert(m||error.message)}
  load();
}
function approve(btn){const id=btn.dataset.id,inp=document.querySelector(`input[data-amt="${CSS.escape(id)}"]`),v=parseFloat(inp&&inp.value);
  if(!(v>0)){alert("Enter the amount to charge.");return}
  if(!confirm(`Approve and send a payment request for ${R(Math.round(v*100))}?`))return;
  call(btn,{id,decision:"approve",amount_cents:Math.round(v*100)})}
function reject(btn){const r=prompt("Reason for the patient (optional):");if(r===null)return;call(btn,{id:btn.dataset.id,decision:"reject",reason:r})}
async function dispatch(btn){lock(btn);const {error}=await sb.rpc("dispatch_order",{oid:btn.dataset.id});if(error)alert(error.message);load()}
boot();
</script></body></html>
